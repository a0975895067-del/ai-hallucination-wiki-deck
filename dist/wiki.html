<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LLM Wiki｜AI 幻覺查證室</title>
  <link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✓</span><span>AI 幻覺查證室</span></a><nav class="nav" aria-label="主要導覽"><a href="index.html">總覽</a><a href="wiki.html" aria-current="page">LLM Wiki</a><a href="slides.html">教學簡報</a><a href="process.html">Loop / Graph</a></nav></header>
  <main id="main">
    <section class="page-hero"><div class="shell"><p class="eyebrow" style="color:var(--coral)">Knowledge base · 6 sources</p><h1>先保存證據，才允許生成結論。</h1><p>每篇資料在 ingest 時被整理成「核心主張、限制、標籤、投影片用途」。搜尋不是只找關鍵字，而是讓簡報能回到可驗證的來源節點。</p></div></section>
    <div class="shell">
      <section aria-labelledby="concept-title" class="section" style="padding-bottom:22px"><div class="section-head"><p class="eyebrow" id="concept-title">Concept map</p><div><h2>四個概念，串起六篇資料。</h2></div></div><div class="concepts" id="conceptGrid"></div></section>
      <div class="toolbar" role="search"><label class="visually-hidden" for="wikiSearch">搜尋 Wiki</label><input class="search" id="wikiSearch" type="search" placeholder="搜尋主張、限制或來源…"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="風險">風險</button><button class="filter" data-filter="檢測">檢測</button><button class="filter" data-filter="降低風險">降低風險</button><span id="resultCount" aria-live="polite"></span></div>
      <section class="source-grid" id="sourceGrid" aria-label="已 ingest 的來源"></section>
      <p class="empty" id="emptyState">找不到符合條件的來源，請換一個關鍵字。</p>
    </div>
  </main>
  <footer class="footer"><div class="shell footer-grid"><span>所有主張均保留原始網址與限制</span><a href="slides.html">下一步：查看教學簡報 →</a></div></footer>
  <script src="data.js"></script><script src="wiki.js"></script>
</body>
</html>
